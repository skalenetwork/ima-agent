name: Comprehensive test

on:
  push:
    branches:
      - develop
      - beta
      - stable
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SKALE_MANAGER_TAG: 1.13.1-stable.0
  SGX_WALLET_IMAGE_TAG: 1.10.3-stable.0

jobs:
  test-comprehensive:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download comprehensive-test and SKALE Manager
        run: |
          git clone --branch main --single-branch https://github.com/skalenetwork/comprehensive-test.git
          git clone --branch "$SKALE_MANAGER_TAG" --single-branch https://github.com/skalenetwork/skale-manager.git comprehensive-test/skale-manager
      - name: Start Ethereum Main Net emulation
        working-directory: comprehensive-test/cli-hh
        run: |
          ./init.sh
          ./run.sh &> ../local_mainnet_output_log.txt &
      - name: Build agent
        working-directory: src
        run: |
          yarn install --frozen-lockfile
          yarn rebuild
      - name: Compile contracts
        working-directory: IMA
        run: yarn install --frozen-lockfile
      - name: Install network-browser
        working-directory: network-browser
        run: bun install --frozen-lockfile
      - name: Install comprehensive-test dependencies
        working-directory: comprehensive-test
        run: |
          (cd test_tokens && yarn install)
          (cd s_chain_gen && ./init.sh)
          (cd skale-manager && yarn install)
          (cd engine && yarn install)
      - name: Start SGX Wallet simulator
        run: |
          docker run -d --name sgxwallet -p 1026-1031:1026-1031 -v /dev/urandom:/dev/random "skalenetwork/sgxwallet_sim:$SGX_WALLET_IMAGE_TAG" -s -y -V -d
          docker logs -f sgxwallet &> comprehensive-test/local_sgxwallet_output_log.txt &
      - name: Wait for SGX Wallet listening ports
        run: |
          deadline=$((SECONDS + 300))
          until netstat -ltn | awk '$4 ~ /:1026$/ { found = 1 } END { exit !found }' && \
                netstat -ltn | awk '$4 ~ /:1027$/ { found = 1 } END { exit !found }'; do
            if (( SECONDS >= deadline )); then
              echo "SGX Wallet did not open ports 1026 and 1027 within 300 seconds"
              tail -n 200 comprehensive-test/local_sgxwallet_output_log.txt
              exit 1
            fi
            sleep 5
          done
      - name: Start transaction manager and redis
        working-directory: comprehensive-test
        env:
          ENDPOINT: http://127.0.0.1:8545
          ETH_PRIVATE_KEY: 23ABDBD3C61B5330AF61EBE8BEF582F4E5CC08E554053A718BDCE7813B9DC1FC
        run: |
          git clone --recursive https://github.com/skalenetwork/transaction-manager
          transaction-manager/scripts/run-test-containers.sh
          docker logs -f tm &> engine/tm.log &
          docker logs -f redis &> engine/redis.log &
      - name: Create certificates
        working-directory: comprehensive-test/engine/create_pems
        run: ./create_pems.sh
      - name: Run comprehensive test
        working-directory: comprehensive-test/engine
        env:
          IMA_AGENT_ROOT_DIR: ${{ github.workspace }}
          ALL_SKALE_TEST_CLOUD_RUN: 1
          SEPARATED_IMA_AGENT_MODE: 1
        run: node index.js
