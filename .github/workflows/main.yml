name: Build and test

on:
  push:
    branches:
      - develop
      - beta
      - stable
  pull_request:

permissions:
  contents: read

jobs:
  test-agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - run: corepack enable
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Lint src
        working-directory: src
        run: |
          yarn install --frozen-lockfile
          yarn lint-check
      - name: Lint network-browser
        working-directory: network-browser
        run: |
          bun install --frozen-lockfile
          bun run lint-check

  test-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.2
      - run: corepack enable
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Build agent
        working-directory: src
        run: |
          yarn install --frozen-lockfile
          yarn rebuild
      - name: Compile contracts
        working-directory: IMA
        run: yarn install --frozen-lockfile
      - name: Install test dependencies
        working-directory: test
        run: |
          yarn install --frozen-lockfile
          pip install -r requirements.txt
      - name: Start ganache
        working-directory: IMA
        run: |
          npx ganache --miner.blockGasLimit 12000000 --logging.quiet --chain.allowUnlimitedContractSize --wallet.defaultBalance 2000000 --wallet.accountKeysPath ../test/accounts.json &
          sleep 3
      - name: Run Python tests
        working-directory: test
        run: |
          python ../scripts/config_from_accounts.py accounts.json config.json
          python test.py
      - name: Run JS tests
        working-directory: test
        run: yarn test
